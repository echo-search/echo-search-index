name: EchoSearch Index Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Download WET paths
        run: |
          wget https://data.commoncrawl.org/crawl-data/CC-MAIN-2026-12/wet.paths.gz
          gunzip wet.paths.gz

      - name: Select batch
        run: head -n 50 wet.paths > batch.txt

      - name: Run index builder
        run: python3 scripts/build_index.py

      - name: Commit index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/index.json
          git commit -m "update index" || echo "no changes"

          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
