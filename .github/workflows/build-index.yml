name: EchoSearch Index Builder

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # ✅ IMPORTANT: switch to WARC
      - name: Download WARC paths
        run: |
          wget https://data.commoncrawl.org/crawl-data/CC-MAIN-2026-12/warc.paths.gz
          gunzip warc.paths.gz

      # ✅ Controlled batching
      - name: Select batch
        run: |
          split -l 500 warc.paths batch_
          mv batch_aa batch.txt   # process ONE batch per run

      # ✅ Run your upgraded parser
      - name: Run index builder
        run: python3 scripts/build_index.py

      # ✅ Commit safely
      - name: Commit index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/index.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "update index"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          finame: EchoSearch Index Builder
