# .github/workflows/trace-svg.yml

name: Trace PNG To SVG

on:
  workflow_dispatch:
  push:
    paths:
      - "favicon 9.png"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pillow numpy scikit-image

      - name: Run tracer
        run: |
          python3 svg-code.py

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add echosearch_exact_trace.svg

          git diff --staged --quiet || git commit -m "Auto-update traced SVG"

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
